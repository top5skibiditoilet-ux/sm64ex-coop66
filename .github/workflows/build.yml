name: Build 32-bit Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget make python3 zip apksigner clang binutils libglvnd-dev libreadline-dev libsdl2-dev aapt

    - name: Compile Native Game Engine (Step 1)
      run: |
        # Use armv7-a to ensure 32-bit compatibility
        make TARGET_ARCH=armv7-a APK=1 -j$(nproc)

    - name: Package APK with Gradle (Step 2)
      run: |
        # Now find the gradlew in the project and build the final APK
        # We use 'find' to locate it dynamically so we don't have to guess the path
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        chmod +x "$GRADLEW_PATH"
        "$GRADLEW_PATH" assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: sm64ex-coop-32bit-APK
        path: "**/*.apk"
