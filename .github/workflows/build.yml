name: Build 32-bit Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools ndk;25.1.8937393'

    - name: Locate NDK and Set Variable
      run: |
        # Use find to locate the NDK, then export it for the job
        NDK_PATH=$(find $ANDROID_SDK_ROOT -name "25.1.8937393" -type d | head -n 1)
        if [ -z "$NDK_PATH" ]; then
          echo "ERROR: NDK not found!"
          exit 1
        fi
        echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make clang binutils libsdl2-dev aapt libreadline-dev

    - name: Compile Native Game Engine
      run: |
        # Point make to the NDK and target 32-bit architecture
        make TARGET_ARCH=armv7-a APK=1 -j$(nproc)

    - name: Verify and Locate Generated APK
      run: |
        echo "Checking if an APK file was generated..."
        find . -name "*.apk"
        
        echo "Listing build directory contents to see what was created:"
        find build -maxdepth 3 2>/dev/null || echo "No build directory found!"

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: sm64ex-coop-32bit-APK
        path: "**/*.apk"
