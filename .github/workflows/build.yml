name: Build 32-bit Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools ndk;25.1.8937393'

    - name: Locate NDK and Set Variable
      run: |
        # Use find to locate the NDK, then export it for the job
        NDK_PATH=$(find $ANDROID_SDK_ROOT -name "25.1.8937393" -type d | head -n 1)
        if [ -z "$NDK_PATH" ]; then
          echo "ERROR: NDK not found!"
          exit 1
        fi
        echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make clang binutils libsdl2-dev aapt libreadline-dev

    - name: Setup Android Wrapper Project
      run: |
        # 1. Clone the base Android app container into a temporary directory outside the workspace
        git clone --recursive https://github.com/robertkirkman/sm64ex-coop-android-base.git ~/android-wrapper
        
        # 2. Clear out its default placeholder engine source files
        rm -rf ~/android-wrapper/app/jni/src/*
        
        # 3. Copy your custom mod repository files right into its source directory
        cp -r . ~/android-wrapper/app/jni/src/
        
        # 4. Bring the merged project folder back into your main workspace directory
        mv ~/android-wrapper $GITHUB_WORKSPACE/wrapper

    - name: Compile Native Game Engine
      run: |
        # Change directory to where your Makefile is now located inside the wrapper layout
        cd $GITHUB_WORKSPACE/wrapper/app/jni/src
        make TARGET_ARCH=armv7-a APK=1 -j$(nproc)

    - name: Package APK with Gradle
      env:
        JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
      run: |
        # Move to the wrapper root where 'gradlew' actually lives
        cd $GITHUB_WORKSPACE/wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: sm64ex-coop-32bit-APK
        path: wrapper/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        compression-level: 6
        overwrite: false
        include-hidden-files: false
