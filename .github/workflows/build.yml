name: Build 32-bit Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify Baserom Exists at Root
      run: |
        echo "Checking for Super Mario 64 ROM..."
        if [ ! -f "baserom.us.z64" ]; then
          echo "=========================================================================="
          echo "ERROR: baserom.us.z64 was NOT found in the root directory!"
          echo "Please ensure your ROM is named EXACTLY 'baserom.us.z64' (all lowercase)."
          echo "Current directory contents:"
          ls -la
          echo "=========================================================================="
          exit 1
        fi
        echo "Success: baserom.us.z64 found and ready for compilation!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools ndk;26.1.10909125'

    - name: Locate NDK and Set Variable
      run: |
        # Locate the precise NDK version expected by the project wrapper
        NDK_PATH=$(find $ANDROID_SDK_ROOT -name "26.1.10909125" -type d | head -n 1)
        if [ -z "$NDK_PATH" ]; then
          echo "ERROR: NDK not found!"
          exit 1
        fi
        echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make clang binutils libsdl2-dev aapt libreadline-dev

    - name: Setup Android Wrapper Project
      run: |
        # 1. Clone the base Android app container
        git clone --recursive https://github.com/robertkirkman/sm64ex-coop-android-base.git ~/android-wrapper
        
        # 2. Completely destroy the default src folder to wipe hidden placeholder files
        rm -rf ~/android-wrapper/app/jni/src
        
        # 3. Recreate a clean src directory
        mkdir -p ~/android-wrapper/app/jni/src
        
        # 4. Cleanly copy your workspace contents (including the verified baserom) into it
        cp -r . ~/android-wrapper/app/jni/src/
        
        # 5. FORCE the Android wrapper config files to switch from 64-bit to 32-bit (armeabi-v7a)
        sed -i 's/arm64-v8a/armeabi-v7a/g' ~/android-wrapper/app/jni/Application.mk 2>/dev/null || true
        sed -i 's/arm64-v8a/armeabi-v7a/g' ~/android-wrapper/app/build.gradle 2>/dev/null || true
        
        # 6. Bring the merged project folder back into your main workspace directory
        mv ~/android-wrapper $GITHUB_WORKSPACE/wrapper

    - name: Compile Native Game Engine Assets
      run: |
        # Navigate directly into the source directory that Gradle builds from
        cd $GITHUB_WORKSPACE/wrapper/app/jni/src

        # Sync the wrapper's touchscreen textures into this source directory layout
        mkdir -p textures/touchcontrols
        cp -r ../textures/touchcontrols/* textures/touchcontrols/ 2>/dev/null || true

        # Compile ALL engine tools, assets, and source code with the Android flags enabled
        make TARGET_ARCH=armv7-a APK=1 ANDROID=1 -j$(nproc)

    - name: Package APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
      run: |
        # Move to the wrapper root and assemble the 32-bit package
        cd $GITHUB_WORKSPACE/wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: sm64ex-coop-32bit-APK
        path: wrapper/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        compression-level: 6
        overwrite: false
        include-hidden-files: false
